services:
  signa:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_SIGNING_BASE_URL: ${NEXT_PUBLIC_SIGNING_BASE_URL:-}
        NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID:-}
        NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: ${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_PICKER_APP_ID: ${NEXT_PUBLIC_GOOGLE_PICKER_APP_ID:-}
        APP_VERSION: ${APP_VERSION:-0.2.0} # x-release-please-version
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      BACKEND_PORT: 3001
      FRONTEND_PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_VERSION: ${APP_VERSION:-0.2.0} # x-release-please-version
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-}

      # Leave DATABASE_URL empty for SQLite at /data/signa.sqlite.
      # Set one PostgreSQL URL to switch database engines.
      DATABASE_URL: ${DATABASE_URL:-}
      # Encrypts PostgreSQL traffic without requiring a custom CA certificate.
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_MIGRATIONS_RUN: ${DATABASE_MIGRATIONS_RUN:-}
      SQLITE_DATABASE_PATH: /data/signa.sqlite
      SQLITE_SYNCHRONIZE: ${SQLITE_SYNCHRONIZE:-true}

      JWT_SECRET: ${JWT_SECRET:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-initial_only}

      STORAGE_SERVICE: ${STORAGE_SERVICE:-auto}
      STORAGE_PATH: /data/storage
      S3_ATTACHMENTS_BUCKET: ${S3_ATTACHMENTS_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      # Backward-compatible and advanced S3 options.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      AWS_S3_SERVER_SIDE_ENCRYPTION: ${AWS_S3_SERVER_SIDE_ENCRYPTION:-}

      # Redis runs privately inside the container when REDIS_URL is empty.
      REDIS_URL: ${REDIS_URL:-}
      QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-}
      BULL_BOARD_ENABLED: ${BULL_BOARD_ENABLED:-false}
      BULL_BOARD_PASS: ${BULL_BOARD_PASS:-change-me-please}

      # Preferred DocuSeal-compatible SMTP contract. SMTP_ADDRESS enables mail.
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_ENABLE_STARTTLS: ${SMTP_ENABLE_STARTTLS:-}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-}
      SMTP_ENABLE_TLS: ${SMTP_ENABLE_TLS:-}
      SMTP_SSL_VERIFY: ${SMTP_SSL_VERIFY:-}
      SMTP_OPEN_TIMEOUT: ${SMTP_OPEN_TIMEOUT:-}
      SMTP_READ_TIMEOUT: ${SMTP_READ_TIMEOUT:-}

      # Legacy Signa mail variables remain supported.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_AUTH_ENABLED: ${MAIL_AUTH_ENABLED:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Signa}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@signa.com}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      MAIL_TLS_REJECT_UNAUTHORIZED: ${MAIL_TLS_REJECT_UNAUTHORIZED:-true}
    ports:
      - "3000:3000"
    volumes:
      - signa-data:/data

volumes:
  signa-data:
